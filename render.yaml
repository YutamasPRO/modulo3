services:
  # Equivalente a EventBridge + SQS: stream "catalog-events" sobre Redis
  - type: keyvalue
    name: catalog-events-redis
    plan: free
    region: oregon
    ipAllowList: []   # solo accesible desde la red privada de Render
    maxmemoryPolicy: noeviction

  # Equivalente a API Gateway + Lambda catalog-fn (publica SpaceChanged)
  - type: web
    name: catalog-service
    runtime: docker
    dockerfilePath: ./catalog-service/Dockerfile
    dockerContext: ./catalog-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"
      - key: EVENT_STREAM
        value: catalog-events
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: catalog-events-redis
          property: connectionString

  # Equivalente a Lambda consumer-fn + orders-service (consume SpaceChanged)
  - type: web
    name: orders-service
    runtime: docker
    dockerfilePath: ./orders-service/Dockerfile
    dockerContext: ./orders-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8002"
      - key: CATALOG_URL
        value: http://catalog-service:8001   # red privada de Render
      - key: EVENT_STREAM
        value: catalog-events
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: catalog-events-redis
          property: connectionString
