services:
  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    ports:
      - "8001:8001"
    networks:
      - coworking-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  orders-service:
    build: ./orders-service
    container_name: orders-service
    ports:
      - "8002:8002"
    env_file:
      - ./orders-service/.env
    environment:
      - CATALOG_URL=http://catalog-service:8001
      - ANALYTICS_URL=http://analytics-service:8003
    depends_on:
      catalog-service:
        condition: service_healthy
    networks:
      - coworking-network

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    ports:
      - "8003:8003"
    env_file:
      - ./analytics-service/.env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/}
      - MONGO_DB_NAME=coworking_analytics
    depends_on:
      - mongodb
    networks:
      - coworking-network

  # MongoDB local para pruebas en desarrollo (en producción se usa MongoDB Atlas)
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - coworking-network

networks:
  coworking-network:
    name: coworking_coworking-network
    driver: bridge

volumes:
  mongo-data:
